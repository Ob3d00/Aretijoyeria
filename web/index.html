<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Äreti · Inventario, ventas y caja para joyería y accesorios.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5F7C5E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Äreti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Äreti</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5F6EF; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #5F7C5E; color: #E6EAD3;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity .25s ease;
    }
    #splash h1 { margin: 0; font-size: 56px; font-weight: 400; letter-spacing: 4px; }
    #splash p { margin: 8px 0 0; font: 12px -apple-system, sans-serif; letter-spacing: 4px; color: #C9D4B6; }
  </style>
</head>
<body>
  <div id="splash"><h1>Äreti</h1><p>JOYERÍA Y ACCESORIOS</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
